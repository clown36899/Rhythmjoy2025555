<IfModule security2_module>
    # This file sorts before mod_security.conf so the phase-1 exclusion is
    # registered before the CRS rule it controls.
    SecRule REQUEST_URI "@streq /api/external/v1/images" "id:1002100,phase:1,pass,nolog,ctl:ruleRemoveById=960010"
    SecRule REQUEST_URI "@beginsWith /api/external/v1/events/" "id:1002101,phase:1,pass,nolog,ctl:ruleRemoveById=960032"

    SecRuleRemoveById 1000002

    <Location "/forum/media/share">
        SecRuleRemoveById 950120
    </Location>

    <Location "/api/fetch-og-image">
        SecRuleRemoveById 950120
    </Location>

    <Location "/api/billboard-manifest">
        SecRuleRemoveById 981173
    </Location>

    <Location "/auth/kakao-callback">
        SecRuleRemoveById 981173
    </Location>

    # UUIDs contain four hyphens, which CRS 2.2.9 rule 981173 mistakes for a
    # SQL-character anomaly during a direct SPA refresh. Exclude only the
    # navigation identifier arguments; API requests remain fully inspected.
    # REQUEST_URI includes the query string in this ModSecurity version, so
    # match the exact SPA path followed by either ? or the end of the value.
    SecRule REQUEST_URI "@rx ^/board(?:[?]|$)" "id:1002102,phase:1,pass,nolog,ctl:ruleRemoveTargetById=981173;ARGS:postId"
    SecRule REQUEST_URI "@rx ^/calendar(?:[?]|$)" "id:1002103,phase:1,pass,nolog,ctl:ruleRemoveTargetById=981173;ARGS:id"

    SecRule REQUEST_METHOD "^TRACE$" "id:1002001,phase:1,deny,log,msg:'TRACE is not allowed'"
    SecRule REQUEST_URI "!^/api(/|$)" "id:1002002,phase:1,deny,log,msg:'Method is not allowed by policy outside SwingEnjoy API',chain"
        SecRule REQUEST_METHOD "!^(?:GET|HEAD|POST|OPTIONS)$"
</IfModule>
